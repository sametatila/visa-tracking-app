name: Daily DB Backup

on:
  schedule:
    # Her gün UTC 03:00'te çalışır (Türkiye saati 06:00)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Create SQL dump
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          export PATH="$HOME/.turso:$PATH"
          turso auth login --api-token "$TURSO_API_TOKEN"
          TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
          turso db shell ${{ secrets.TURSO_DB_NAME }} .dump > "backup-${TIMESTAMP}.sql"
          echo "BACKUP_FILE=backup-${TIMESTAMP}.sql" >> $GITHUB_ENV
          echo "Backup size: $(wc -c < "backup-${TIMESTAMP}.sql") bytes"
          echo "Row count: $(grep -c '^INSERT' "backup-${TIMESTAMP}.sql") rows"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 7
